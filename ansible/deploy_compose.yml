---
- name: Deploy the telemetry Docker Compose stack
  hosts: pi
  become: true
  gather_facts: true

  vars:
    repo_root: "{{ playbook_dir }}/.."
    remote_stack_dir: "/home/{{ ansible_user }}/telemetry"
    compose_service_name: "garden-telemetry-compose.service"

  tasks:
    - name: Ensure remote stack directory exists
      ansible.builtin.file:
        path: "{{ remote_stack_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure Grafana and Prometheus data directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/mnt/storage/grafana_data", owner: "472", group: "472", mode: "0775" }
        - { path: "/mnt/storage/prometheus_data", owner: "65534", group: "65534", mode: "0775" }

    - name: Copy docker-compose file to the remote host
      ansible.builtin.copy:
        src: "{{ repo_root }}/docker-compose.yaml"
        dest: "{{ remote_stack_dir }}/docker-compose.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Copy telemetry config directory
      ansible.builtin.copy:
        src: "{{ repo_root }}/telemetry/"
        dest: "{{ remote_stack_dir }}/telemetry/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy Grafana provisioning files
      ansible.builtin.copy:
        src: "{{ repo_root }}/grafana/provisioning/"
        dest: "{{ remote_stack_dir }}/grafana/provisioning/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy Grafana dashboard files
      ansible.builtin.copy:
        src: "{{ repo_root }}/grafana/dashboards/"
        dest: "{{ remote_stack_dir }}/grafana/dashboards/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Render the compose systemd unit from the repo template
      ansible.builtin.template:
        src: "{{ repo_root }}/mqtt-processor/systemd/garden-telemetry-compose.service"
        dest: "/etc/systemd/system/{{ compose_service_name }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        STACK_DIR: "{{ remote_stack_dir }}"
        SERVICE_USER: "{{ ansible_user }}"
        SERVICE_GROUP: "{{ ansible_user }}"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start the Docker Compose stack service
      ansible.builtin.systemd:
        name: "{{ compose_service_name }}"
        enabled: true
        state: restarted
