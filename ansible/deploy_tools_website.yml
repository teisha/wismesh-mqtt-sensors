---
- name: Deploy only tools website stack and DB backup setup
  hosts: pi
  become: true
  gather_facts: true

  vars:
    repo_root: "{{ playbook_dir }}/.."
    remote_stack_dir: "/home/{{ ansible_user }}/telemetry"

  tasks:
    - name: Ensure remote stack directory exists
      ansible.builtin.file:
        path: "{{ remote_stack_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure tools website DB and backup directories exist on mounted storage
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/mnt/storage/tools_api_data", owner: "{{ ansible_user }}", group: "{{ ansible_user }}", mode: "0775" }
        - { path: "/mnt/storage/tools_api_backups", owner: "{{ ansible_user }}", group: "{{ ansible_user }}", mode: "0775" }

    - name: Copy docker-compose file to the remote host
      ansible.builtin.copy:
        src: "{{ repo_root }}/docker-compose.yaml"
        dest: "{{ remote_stack_dir }}/docker-compose.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Copy tools_website module files
      ansible.builtin.copy:
        src: "{{ repo_root }}/tools_website/"
        dest: "{{ remote_stack_dir }}/tools_website/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Ensure tools website backup script is executable
      ansible.builtin.file:
        path: "{{ remote_stack_dir }}/tools_website/scripts/backup_tools_db.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Schedule nightly tools DB backup cron
      ansible.builtin.cron:
        name: "Nightly tools website DB backup"
        user: "{{ ansible_user }}"
        minute: "15"
        hour: "2"
        job: "{{ remote_stack_dir }}/tools_website/scripts/backup_tools_db.sh >> /home/{{ ansible_user }}/telemetry/tools_website/backup.log 2>&1"

    - name: Build and start only tools website services
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yaml up -d --build --no-deps tools-api tools-ui
        chdir: "{{ remote_stack_dir }}"
