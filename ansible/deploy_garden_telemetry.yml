---
- name: Deploy the Python garden telemetry service
  hosts: pi
  become: false
  gather_facts: true

  vars_prompt:
    - name: ansible_single_password
      prompt: "SSH/sudo password"
      private: true

  vars:
    repo_root: "{{ playbook_dir }}/.."
    app_dir: "/home/{{ ansible_user }}/mqtt-processor"
    app_parent_dir: "/home/{{ ansible_user }}"
    venv_dir: "{{ app_dir }}/.venv"
    service_name: "garden-telemetry.service"
    local_bundle: "/tmp/mqtt-processor-deploy.tar.gz"
    remote_bundle: "/tmp/mqtt-processor-deploy.tar.gz"
    ansible_ssh_pass: "{{ ansible_single_password }}"
    ansible_become_pass: "{{ ansible_single_password }}"

  tasks:
    - name: Ensure the app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Build a deployment archive on the controller
      ansible.builtin.command:
        cmd: >-
          tar -czf {{ local_bundle }}
          --exclude='mqtt-processor/.venv'
          --exclude='mqtt-processor/.pytest_cache'
          --exclude='mqtt-processor/.mypy_cache'
          --exclude='mqtt-processor/.git'
          --exclude='**/__pycache__'
          -C {{ repo_root }}
          mqtt-processor
      delegate_to: localhost

    - name: Upload the deployment archive to the target host
      ansible.builtin.copy:
        src: "{{ local_bundle }}"
        dest: "{{ remote_bundle }}"
        mode: "0644"

    - name: Remove previous app tree before extracting
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent

    - name: Extract the deployment archive on the target host
      ansible.builtin.unarchive:
        src: "{{ remote_bundle }}"
        dest: "{{ app_parent_dir }}"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      notify:
        - Restart garden telemetry service

    - name: Remove deployment archive from target host
      ansible.builtin.file:
        path: "{{ remote_bundle }}"
        state: absent

    - name: Remove deployment archive from controller
      ansible.builtin.file:
        path: "{{ local_bundle }}"
        state: absent
      delegate_to: localhost

    - name: Create the Python virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}/bin/python"

    - name: Install Python requirements
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt"
      notify:
        - Restart garden telemetry service

    - name: Render the service unit from the repo template
      become: true
      ansible.builtin.template:
        src: "{{ repo_root }}/mqtt-processor/systemd/garden-telemetry.service"
        dest: "/etc/systemd/system/{{ service_name }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        APP_DIR: "{{ app_dir }}"
        VENV_PYTHON: "{{ venv_dir }}/bin/python"
        APP_PY: "{{ app_dir }}/src/app.py"
        SERVICE_USER: "{{ ansible_user }}"
        SERVICE_GROUP: "{{ ansible_user }}"
        ENV_FILE: "{{ app_dir }}/config/garden-telemetry.env"
        SERVICE_WANTED_BY: "multi-user.target"
      notify:
        - Reload systemd daemon
        - Restart garden telemetry service

    - name: Ensure the garden telemetry service is enabled and started
      become: true
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started

  handlers:
    - name: Reload systemd daemon
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart garden telemetry service
      become: true
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted

