  #           - AttributeName: PK
  #             KeyType: RANGE
  #         Projection:
  #           ProjectionType: ALL
  #       - IndexName: SearchIndex
  #         KeySchema:
  #           - AttributeName: search_attribute
  #             KeyType: HASH
  #           - AttributeName: PK
  #             KeyType: RANGE
  #         Projection:
  #           ProjectionType: ALL

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaS3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::2u-import
                  - !Sub arn:aws:s3:::2u-import/partner/imports/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${BucketName}
                  - !Sub arn:aws:s3:::${BucketName}/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: 
                  - !GetAtt GardenTelemetryTable.Arn
                  - !Sub ${GardenTelemetryTable.Arn}/*
                  # - !GetAtt OutputTable.Arn
                  # - !Sub ${OutputTable.Arn}/*                

