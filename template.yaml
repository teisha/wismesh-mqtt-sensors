AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: The stage of the application (e.g., dev, prod)
  EcrRepoName:
    Type: String
    Default: s3-events
    Description: The name of the project
  Region:
    Type: String
    Default: us-east-1
    Description: The AWS region to deploy the resources
  BucketName:
    Type: String
    Default: serverless-tdb-app-dev-clienthostbucket-1sr8hxithgtfg
    Description: The name of the S3 bucket to monitor for events
  PiIamUserName:
    Type: String
    Default: raspi-garden-bridge
    Description: IAM user allowed to assume the Raspberry Pi bridge role

Resources:
  GardenTelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # DeletionPolicy: Retain
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: search_attribute
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: SK
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SearchIndex
          KeySchema:
            - AttributeName: search_attribute
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  RaspberryPiBridgeManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${Stage}-garden-telemetry-bridge-policy
      Description: !Sub DynamoDB access for Raspberry Pi bridge in ${Stage}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt GardenTelemetryTable.Arn
              - !Sub ${GardenTelemetryTable.Arn}/index/*

  RaspberryPiBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Stage}-garden-telemetry-bridge-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:user/${PiIamUserName}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RaspberryPiBridgeManagedPolicy

  # OutputTable:
  #   Type: AWS::DynamoDB::Table
  #   Properties:
  #     # DeletionPolicy: Retain
  #     AttributeDefinitions:
  #       - AttributeName: PK
  #         AttributeType: S
  #       - AttributeName: SK
  #         AttributeType: S
  #       - AttributeName: search_attribute
  #         AttributeType: S
  #     KeySchema:
  #       - AttributeName: PK
