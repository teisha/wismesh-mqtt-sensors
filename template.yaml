Outputs:
  GardenTelemetryTableName:
    Description: The name of the DynamoDB table that holds metadata and configs
    Value: !Ref GardenTelemetryTable
  # OutputTableName:
  #   Description: The name of the DynamoDB table that holds data related to job outputs
  #   Value: !Ref OutputTable    
  LambdaExecutionRoleArn:
    Description: The ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
  RaspberryPiBridgeManagedPolicyArn:
    Description: Managed policy ARN for Raspberry Pi bridge access
    Value: !Ref RaspberryPiBridgeManagedPolicy
  RaspberryPiBridgeRoleArn:
    Description: IAM role ARN for Raspberry Pi bridge
    Value: !GetAtt RaspberryPiBridgeRole.Arn
